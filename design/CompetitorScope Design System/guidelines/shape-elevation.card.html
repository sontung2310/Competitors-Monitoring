<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Flat by default; shadow only on hover of a clickable card, or on overlays" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body style="background:var(--surface-page)">
<div style="display:flex;gap:16px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-none)"><div class="n">Static card</div><div class="v">flat — the default</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-hover)"><div class="n">Clickable, hovered</div><div class="v">0 4px 16px / 8%</div></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-overlay)"><div class="n">Overlay</div><div class="v">dropdowns, modals</div></div>
</div></body></html>
