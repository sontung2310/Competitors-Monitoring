<!-- @dsCard group="Colors" viewport="700x170" name="Favorability" subtitle="Mint means added/favorable, red means removed, amber means judge it yourself" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:12px"><div style="height:6px;border-radius:99px;background:var(--signal-favorable)"></div><div class="n" style="margin-top:8px">Favorable / added</div><div class="v">NEW_BLOG · NEW_PRODUCT · SUGGESTED</div></div>
<div style="border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:12px"><div style="height:6px;border-radius:99px;background:var(--signal-neutral)"></div><div class="n" style="margin-top:8px">Neutral / attention</div><div class="v">PRICE_CHANGE — direction is the viewer's call</div></div>
<div style="border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:12px"><div style="height:6px;border-radius:99px;background:var(--signal-unfavorable)"></div><div class="n" style="margin-top:8px">Unfavorable / removed</div><div class="v">PRODUCT_REMOVED · FAILED</div></div>
</div></body></html>
