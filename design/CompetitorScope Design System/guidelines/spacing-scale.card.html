<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-1);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">8</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-2);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">16</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-3);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">24</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-4);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">32</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-5);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">40</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-6);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">48</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-8);height:56px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius-sm)"></div><div class="v">64</div></div>
