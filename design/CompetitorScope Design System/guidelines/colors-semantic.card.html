<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Monitoring-run status colors — error stays distinct from brand red" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--color-success)"></div><div class="n">success</div><div class="v">#16A34A · SUCCESS</div></div><div class="s"><div class="chip" style="background:var(--color-warning)"></div><div class="n">warning</div><div class="v">#D97706 · RUNNING</div></div><div class="s"><div class="chip" style="background:var(--color-error)"></div><div class="n">error</div><div class="v">#DC2626 · FAILED</div></div><div class="s"><div class="chip" style="background:var(--color-primary)"></div><div class="n">primary</div><div class="v">#E4362A · UI accent only</div></div>
</div></body></html>
