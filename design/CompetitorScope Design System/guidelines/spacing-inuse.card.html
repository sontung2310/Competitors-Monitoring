<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing in use" subtitle="24px card padding, 16px card gap, 32px page padding" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body style="background:var(--surface-page)">
<div style="display:flex;gap:var(--card-gap)">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:var(--card-padding)"><div class="n">24px padding</div><div class="v">--card-padding</div></div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:var(--card-padding)"><div class="n">16px between</div><div class="v">--card-gap</div></div>
</div></body></html>
