<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--color-bg)"></div><div class="n">bg</div><div class="v">#FFFFFF</div></div><div class="s"><div class="chip" style="background:var(--color-bg-subtle)"></div><div class="n">bg-subtle</div><div class="v">#F7F7F8</div></div><div class="s"><div class="chip" style="background:var(--color-border)"></div><div class="n">border</div><div class="v">#E5E7EB</div></div><div class="s"><div class="chip" style="background:var(--color-text-muted)"></div><div class="n">text-muted</div><div class="v">#6B7280</div></div><div class="s"><div class="chip" style="background:var(--color-text)"></div><div class="n">text</div><div class="v">#1A1A1A</div></div>
</div></body></html>
