<!-- @dsCard group="Type" viewport="700x150" name="Labels & metrics" subtitle="Uppercase 13px tracked labels above tabular figures" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:flex;gap:40px">
<div><div style="font:var(--type-meta);font-weight:600;letter-spacing:var(--label-letter-spacing);text-transform:uppercase;color:var(--text-meta)">Active pages</div><div style="font:var(--type-h1);font-variant-numeric:tabular-nums">3</div></div>
<div><div style="font:var(--type-meta);font-weight:600;letter-spacing:var(--label-letter-spacing);text-transform:uppercase;color:var(--text-meta)">Changes / 7d</div><div style="font:var(--type-h1);font-variant-numeric:tabular-nums">12</div></div>
<div><div style="font:var(--type-meta);font-weight:600;letter-spacing:var(--label-letter-spacing);text-transform:uppercase;color:var(--text-meta)">Price</div><div style="font:var(--type-h1);font-variant-numeric:tabular-nums">$179.99</div></div>
</div></body></html>
