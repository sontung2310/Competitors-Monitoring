<!-- @dsCard group="Brand" viewport="700x190" name="Interaction states" subtitle="Hover darkens or tints; nothing scales, bounces or lifts" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font:var(--type-meta)">
<div><div style="background:var(--color-primary);color:#fff;border-radius:var(--radius-md);padding:10px 0;text-align:center;font-weight:700;font-size:var(--font-size-body)">Activate</div><div class="v" style="margin-top:6px">Default</div></div><div><div style="background:var(--color-primary-hover);color:#fff;border-radius:var(--radius-md);padding:10px 0;text-align:center;font-weight:700;font-size:var(--font-size-body)">Activate</div><div class="v" style="margin-top:6px">Hover</div></div><div><div style="background:var(--color-text-muted);color:#fff;border-radius:var(--radius-md);padding:10px 0;text-align:center;font-weight:700;font-size:var(--font-size-body)">Activate</div><div class="v" style="margin-top:6px">Disabled</div></div><div><div style="background:var(--color-primary-light);color:var(--color-primary);border-radius:var(--radius-md);padding:10px 0;text-align:center;font-weight:700;font-size:var(--font-size-body)">Activate</div><div class="v" style="margin-top:6px">Selected row</div></div>
</div>
<div class="v" style="margin-top:14px">Transitions are 120ms on color only. No transforms, no scale-on-press, no shadow lift on buttons.</div></body></html>
