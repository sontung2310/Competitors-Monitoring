<!-- @dsCard group="Colors" viewport="700x150" name="Simulated marker" subtitle="The one solid-fill amber in the product — reserved, never softened" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:16px 20px}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:6px;min-width:110px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(26,26,26,.08)}.n{font:var(--type-meta);font-weight:600;color:var(--text-body)}.v{font:var(--type-meta);color:var(--text-meta);font-variant-numeric:tabular-nums}</style></head><body>
<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:5px;background:var(--simulated-bg);color:var(--simulated-fg);font:var(--type-meta);font-weight:700;letter-spacing:.06em;border-radius:var(--radius-sm);padding:5px 11px">🧪 SIMULATED</span>
<span style="display:inline-flex;align-items:center;background:var(--badge-warning-bg);color:var(--color-warning);font:var(--type-meta);font-weight:600;letter-spacing:.06em;border-radius:var(--radius-pill);padding:3px 10px">RUNNING</span>
<div class="v" style="max-width:380px">Left: solid fill, white bold text, 6px radius. Right: the routine 15%-tint pill. They must never be confusable.</div>
</div></body></html>
