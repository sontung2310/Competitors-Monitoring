<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:20px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}.cap{font:var(--type-meta);color:var(--text-meta);letter-spacing:.06em;text-transform:uppercase;font-weight:600}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { StatusBadge, RunStatusBadge, DiscoveryStatusBadge, SimulatedBadge, ChangeTypeBadge, PriceDelta, PageTypeLabel, EmptyState, Button } = window.CompetitorScopeDesignSystem_312ddb;
function Demo(){
  return (<div className="col" style={{gap:18}}>
    <div><div className="cap" style={{marginBottom:8}}>Run status · discovery status</div>
      <div className="row"><RunStatusBadge status="SUCCESS"/><RunStatusBadge status="FAILED"/><RunStatusBadge status="RUNNING"/>
      <span style={{width:16}}/><DiscoveryStatusBadge status="SUGGESTED"/><DiscoveryStatusBadge status="ACTIVE"/><DiscoveryStatusBadge status="DISCARDED"/></div></div>
    <div><div className="cap" style={{marginBottom:8}}>Change types · simulated marker</div>
      <div className="row"><ChangeTypeBadge type="NEW_BLOG"/><ChangeTypeBadge type="NEW_PRODUCT"/><ChangeTypeBadge type="PRODUCT_REMOVED"/><ChangeTypeBadge type="PRICE_CHANGE"/><ChangeTypeBadge type="PAGE_UPDATE"/><SimulatedBadge/></div></div>
    <div><div className="cap" style={{marginBottom:8}}>Page types · price delta</div>
      <div className="row"><PageTypeLabel type="BLOG" method="RULE"/><PageTypeLabel type="PRODUCT_LISTING" method="LLM"/><PageTypeLabel type="PRICING" method="MANUAL"/>
      <span style={{width:16}}/><PriceDelta from="$219.99" to="$179.99"/></div></div>
    <div style={{border:'1px solid var(--border-card)',borderRadius:'var(--radius-lg)'}}>
      <EmptyState icon="radar" message="No pages tracked yet — run discovery to find some." action={<Button variant="secondary" icon="refresh-cw" size="sm">Run Discovery</Button>} style={{padding:'24px 16px'}}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
