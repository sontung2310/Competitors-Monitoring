<!-- @dsCard group="Components" viewport="700x380" name="Data — Tiles, competitor card, rows" subtitle="Stat tiles, the dashboard competitor card, candidate rows and changes-feed rows" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:20px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}.cap{font:var(--type-meta);color:var(--text-meta);letter-spacing:.06em;text-transform:uppercase;font-weight:600}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { StatTile, CompetitorCard, CandidateRow, SimulateButton, ChangeRow, PriceDelta, Button } = window.CompetitorScopeDesignSystem_312ddb;
function Demo(){
  const [busy,setBusy]=React.useState(false);
  return (<div className="col" style={{gap:16,background:'var(--surface-page)',margin:-20,padding:20}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12}}>
      <StatTile label="Active targets" value="3" icon="crosshair"/>
      <StatTile label="Changes / 7d" value="12" icon="activity" favorable trend={{direction:'up',label:'+4 vs last week'}}/>
      <StatTile label="Failed runs" value="1" icon="alert-triangle" favorable={false} trend={{direction:'up',label:'+1'}}/>
    </div>
    <CompetitorCard name="Lyfe Marketing" website="lyfemarketing.com" activeTargets={3} recentChanges={12}/>
    <div style={{background:'var(--surface-card)',border:'1px solid var(--border-card)',borderRadius:'var(--radius-lg)',overflow:'hidden'}}>
      <CandidateRow url="https://lyfemarketing.com/blog" pageType="BLOG" method="RULE" status="SUGGESTED" actions={<><Button size="sm">Activate</Button><Button size="sm" variant="quiet">Discard</Button></>}/>
      <CandidateRow url="https://lyfemarketing.com/pricing" pageType="PRICING" method="LLM" status="ACTIVE" interval="6 h" actions={<SimulateButton loading={busy} onClick={()=>{setBusy(true);setTimeout(()=>setBusy(false),1600)}}/>}/>
      <CandidateRow url="https://lyfemarketing.com/careers" pageType="CAREERS" method="RULE" status="DISCARDED" style={{borderBottom:0}}/>
    </div>
    <div style={{background:'var(--surface-card)',border:'1px solid var(--border-card)',borderRadius:'var(--radius-lg)',overflow:'hidden'}}>
      <ChangeRow changeType="NEW_BLOG" summary={'New post: “7 B2B Content Trends for 2026”'} target="lyfemarketing.com/blog" detectedAt="2 hours ago"/>
      <ChangeRow changeType="PRICE_CHANGE" summary="Nike Pegasus 41 price changed" detail={<PriceDelta from="$219.99" to="$179.99"/>} target="jd-sports.com.au/mens-shoes" detectedAt="just now" isSimulated style={{borderBottom:0}}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
