<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-family);background:var(--color-bg);color:var(--color-text);padding:20px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}.cap{font:var(--type-meta);color:var(--text-meta);letter-spacing:.06em;text-transform:uppercase;font-weight:600}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Sidebar, TopBar, SegmentedSwitcher, TextTabs, Button, Select } = window.CompetitorScopeDesignSystem_312ddb;
function Demo(){
  const [nav,setNav]=React.useState('changes');
  const [seg,setSeg]=React.useState('SUGGESTED');
  const [tab,setTab]=React.useState('changes');
  return (<div style={{display:'flex',border:'1px solid var(--border-card)',borderRadius:'var(--radius-lg)',overflow:'hidden',height:270}}>
    <Sidebar active={nav} onSelect={setNav} style={{borderRadius:0}} items={[
      {value:'dashboard',label:'Dashboard',icon:'layout-dashboard'},
      {value:'competitors',label:'Competitors',icon:'users',count:1},
      {value:'changes',label:'Changes',icon:'activity',count:12},
      {value:'settings',label:'Settings',icon:'settings'}]}
      footer={<Select size="sm" value="me" options={[{value:'me',label:'Marketing Eye'}]}/>}/>
    <div style={{flex:1,background:'var(--surface-page)',minWidth:0}}>
      <TopBar breadcrumb="Competitors" title="Lyfe Marketing" meta="lyfemarketing.com" actions={<Button size="sm" icon="refresh-cw">Run Discovery</Button>}/>
      <div className="col" style={{padding:20,gap:18}}>
        <SegmentedSwitcher value={seg} onChange={setSeg} options={[{value:'SUGGESTED',label:'Suggested',count:6},{value:'ACTIVE',label:'Active',count:3},{value:'DISCARDED',label:'Discarded',count:11}]}/>
        <TextTabs value={tab} onChange={setTab} options={[{value:'changes',label:'Changes'},{value:'targets',label:'Tracked pages'}]}/>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
